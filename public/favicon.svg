<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4f7"/>
      <stop offset="100%" stop-color="#fce8ed"/>
    </radialGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd5e0"/>
      <stop offset="100%" stop-color="#f27e93"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a0"/>
      <stop offset="100%" stop-color="#F2BE5C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- 5 petals (sakura style) -->
  <g transform="translate(32,32)">
    <ellipse cx="0" cy="-11" rx="5.5" ry="9.5" fill="url(#petal)" opacity="0.92" transform="rotate(0)"/>
    <ellipse cx="0" cy="-11" rx="5.5" ry="9.5" fill="url(#petal)" opacity="0.92" transform="rotate(72)"/>
    <ellipse cx="0" cy="-11" rx="5.5" ry="9.5" fill="url(#petal)" opacity="0.92" transform="rotate(144)"/>
    <ellipse cx="0" cy="-11" rx="5.5" ry="9.5" fill="url(#petal)" opacity="0.92" transform="rotate(216)"/>
    <ellipse cx="0" cy="-11" rx="5.5" ry="9.5" fill="url(#petal)" opacity="0.92" transform="rotate(288)"/>

    <!-- Petal notch lines (sakura detail) -->
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="#c45a72" stroke-width="0.6" opacity="0.4" transform="rotate(0)"/>
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="#c45a72" stroke-width="0.6" opacity="0.4" transform="rotate(72)"/>
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="#c45a72" stroke-width="0.6" opacity="0.4" transform="rotate(144)"/>
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="#c45a72" stroke-width="0.6" opacity="0.4" transform="rotate(216)"/>
    <line x1="0" y1="-3" x2="0" y2="-20" stroke="#c45a72" stroke-width="0.6" opacity="0.4" transform="rotate(288)"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="6.5" fill="url(#center)"/>
    <circle cx="0" cy="0" r="3" fill="#fff8e0" opacity="0.9"/>

    <!-- Stamen dots -->
    <circle cx="0" cy="-2" r="0.9" fill="#c8862a" opacity="0.7"/>
    <circle cx="1.8" cy="1" r="0.9" fill="#c8862a" opacity="0.7"/>
    <circle cx="-1.8" cy="1" r="0.9" fill="#c8862a" opacity="0.7"/>
  </g>
</svg>
